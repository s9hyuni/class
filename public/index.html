<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="텀블러 생산과 출고 기록의 흐름을 확인하는 교육용 운영 대시보드입니다.">
  <title>텀블공장 · 오늘 운영</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/today" aria-label="텀블공장 관제 대시보드 오늘 운영"><img class="brand-logo" src="./assets/tumble-factory-logo.png" alt=""><span class="brand-copy"><strong>텀블공장</strong><span class="brand-site-name">관제 대시보드</span></span></a>
      <div class="header-actions">
        <label class="view-time-control">기준 시각 <select id="view-time" aria-label="기준 시각"><option value="">현재</option></select></label>
        <span id="freshness" class="connection-status neutral" role="status">확인 중</span>
        <div class="refresh-wrap">
          <button id="refresh-btn" type="button" class="refresh-btn" aria-label="데이터 새로고침" title="데이터 새로고침">
            <svg class="refresh-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
          </button>
          <span id="countdown-text" class="countdown-text" aria-hidden="true">조회 중…</span>
        </div>
        <div class="notification-wrap">
          <button id="header-alerts-link" type="button" class="alerts-link neutral" aria-label="알림 확인 중" aria-expanded="false" aria-controls="notification-dropdown">
            <svg class="bell-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span id="header-alerts-text" class="alerts-text">알림 확인 중</span>
          </button>
          <section id="notification-dropdown" class="notification-dropdown" aria-label="알림 목록" hidden></section>
        </div>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section id="page-content" aria-labelledby="page-title">
      <div class="page-heading"><h1 id="page-title">오늘 운영</h1><p id="page-description">생산·출고 실적과 운영 상태를 살펴봅니다.</p></div>
      <div id="today-view"></div>
    </section>
    <noscript><p class="notice warning">화면을 보려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
  </main>
  <footer>텀블공장 · 생산·출고 운영</footer>
</body>
</html>
